<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train times</title>
<style>
  :root {
    --page: #000;          /* darkest background: shows between rows */
    --row: #2b2d33;        /* countdown row panel */
    --num: #9ea1a9;        /* MIN labels */
    --ink: #ffffff;
    --muted: #b9bcc4;
    --u: 90px;            /* one train row's height; every row size scales from it (set by script) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: Roboto, Arial, Helvetica, sans-serif; overflow: hidden; }
  .screen { height: 100%; width: 100%; display: flex; flex-direction: column; padding: 2.2vh 2.4vw; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.8vh; }
  header .station { font-size: 4.2vh; font-weight: 700; letter-spacing: .02em; }
  header .station small { display: block; font-size: 2.1vh; font-weight: 400; color: var(--muted); }
  header .clock { font-size: 4.4vh; font-variant-numeric: tabular-nums; font-weight: 400; }
  header .clock .hm { font-weight: 700; }
  header .clock .s { font-weight: 400; }

  .board { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .train { flex: 0 0 auto; display: flex; align-items: center; }
  .card {
    flex: 1 1 auto; min-width: 0; height: 100%;
    display: flex; align-items: center;
    background: var(--row); padding: 0 2vw 0 1.6vw;
  }
  .bullet {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; margin-right: calc(var(--u) * 0.2);
    width: calc(var(--u) * 0.62); height: calc(var(--u) * 0.62); border-radius: 50%; background: #808183; color: #fff;
    font-weight: 700; font-size: calc(var(--u) * 0.34);
  }
  .dest { flex: 1 1 auto; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .dest .name { font-size: calc(var(--u) * 0.368); font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .dest .sub { font-size: calc(var(--u) * 0.23); color: var(--ink); margin-top: calc(var(--u) * 0.02); line-height: 1.15; white-space: nowrap; }
  .eta { flex: 0 0 auto; text-align: right; margin-left: calc(var(--u) * 0.25); }
  .eta .mins { font-size: calc(var(--u) * 0.46); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .eta .unit { font-size: calc(var(--u) * 0.14); font-weight: 700; color: var(--num); letter-spacing: .08em; }
  .empty { padding: 2vh; color: var(--muted); font-size: 2.6vh; }

  .status { flex: 0 0 auto; margin-top: 1.8vh; border-top: 1px solid #222; padding-top: 1.4vh; }
  .status h2 { margin: 0 0 1vh; font-size: 3vh; font-weight: 700; }
  .status .item { display: flex; align-items: flex-start; margin-bottom: 1vh; }
  .status .item[hidden] { display: none; }
  .status .item .bullet { width: 4.2vh; height: 4.2vh; font-size: 2.4vh; margin-right: 1.2vw; }
  .status .item .text { font-size: 2.3vh; line-height: 1.3; }
  .status .item .text b { display: block; font-size: calc(2.6vh * var(--title-scale, 1)); }
  .status .item .text .d { font-size: calc(2.3vh * var(--desc-scale, 1)); }
  .status .item .text .d.off { display: none; }
  .status .item .text .lines { font-size: 2vh; color: var(--muted); }
  .status .more { font-size: 2vh; color: var(--muted); margin-top: 0.6vh; }
  .status .ok { font-size: 2.4vh; color: var(--muted); }
  .footer { flex: 0 0 auto; display: flex; justify-content: space-between; font-size: 1.8vh; color: var(--muted); margin-top: 0.8vh; }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="station">
      <span id="station">Loading…</span>
      <small id="subtitle"></small>
    </div>
    <div class="clock" id="clock"><span class="hm">--:--</span><span class="s">:--</span></div>
  </header>

  <section class="board" id="board">
    <div class="empty">Loading trains…</div>
  </section>

  <section class="status">
    <h2>Happening now</h2>
    <div id="alerts"><div class="ok">Checking line status…</div></div>
  </section>

  <div class="footer">
    <span id="updated"></span>
    <span>Data: MTA via realtimerail.nyc</span>
  </div>
</div>

<script>
  // Settings come from the URL. Examples:
  //   index.html                                    Penn Station (34 St), uptown 1 train (defaults)
  //   index.html?stop=116&direction=S               125 St, downtown
  //   index.html?stop=116S                          a directional stop ID also works
  //   index.html?stop=631&direction=N&route=6&count=4&label=Uptown
  // stop       stop ID, with or without an N/S suffix (default 128, Penn Station)
  // direction  N or S, used when the stop has no suffix (default N)
  // route      line(s) to show, e.g. route=1 or route=1,2,3 or route=1&route=2 (default 1)
  //            trains from all listed lines are merged and sorted by time
  // count      how many trains to show, 1 to 10 (default 7)
  // label      direction name under the station name (default from direction)
  // Data comes from the public Transiter API that realtimerail.nyc uses; it allows any origin.
  const params = new URLSearchParams(window.location.search);
  const DIRECTION = (params.get("direction") || "N").toUpperCase() === "S" ? "S" : "N";
  const RAW_STOP = (params.get("stop") || "128").toUpperCase();
  const STOP_ID = /[NS]$/.test(RAW_STOP) ? RAW_STOP : RAW_STOP + DIRECTION;
  // route can repeat (route=1&route=2) or list commas (route=1,2,3); trains from all of them are merged.
  const ROUTES = params.getAll("route").join(",").split(",")
    .map(r => r.trim().toUpperCase()).filter(r => r);
  if (ROUTES.length === 0) ROUTES.push("1");
  const COUNT = Math.min(10, Math.max(1, parseInt(params.get("count"), 10) || 7));
  const LABEL = params.get("label") || (DIRECTION === "N" ? "Uptown" : "Downtown");

  const BASE = "https://realtimerail.nyc/transiter/v0.6/systems/us-ny-subway";
  const STOP_URL = BASE + "/stops/" + encodeURIComponent(STOP_ID);
  const REFRESH_MS = 30000;

  // Bullet colours by line (MTA colours). Unknown lines fall back to grey.
  const LINE_COLORS = {
    "1": "#d9222a", "2": "#d9222a", "3": "#d9222a",
    "4": "#00933c", "5": "#00933c", "6": "#00933c",
    "7": "#b933ad",
    "A": "#2850ad", "C": "#2850ad", "E": "#2850ad",
    "B": "#ff6319", "D": "#ff6319", "F": "#ff6319", "M": "#ff6319",
    "G": "#6cbe45",
    "J": "#996633", "Z": "#996633",
    "L": "#a7a9ac",
    "N": "#fccc0a", "Q": "#fccc0a", "R": "#fccc0a", "W": "#fccc0a",
    "S": "#808183", "SI": "#2850ad"
  };
  function lineColor(id) { return LINE_COLORS[String(id).toUpperCase()] || "#808183"; }

  function pad(n) { return String(n).padStart(2, "0"); }

  function tickClock() {
    const d = new Date();
    const hour12 = d.getHours() % 12 === 0 ? 12 : d.getHours() % 12;   // 12-hour, no AM/PM
    document.querySelector("#clock .hm").textContent = hour12 + ":" + pad(d.getMinutes());
    document.querySelector("#clock .s").textContent = ":" + pad(d.getSeconds());
  }

  function minutesUntil(epochSeconds) {
    return Math.round((epochSeconds - Date.now() / 1000) / 60);
  }

  function escapeText(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  // Every row size scales from --u (one row's height), so the layout holds for any row count.
  // The direction name is 1.6x the terminal text. If either is too wide for its row, both shrink
  // together (the factor s) so the ratio holds.
  const NAME_RATIO = 1.6, SCALE_MAX = 1.0, SCALE_MIN = 0.4;
  function setScale(name, sub, s) {
    sub.style.fontSize = "calc(var(--u) * 0.23 * " + s + ")";
    name.style.fontSize = "calc(var(--u) * 0.23 * " + (s * NAME_RATIO) + ")";
  }
  function fitRow(dest) {
    const name = dest.querySelector(".name");
    const sub = dest.querySelector(".sub");
    let s = SCALE_MAX;
    setScale(name, sub, s);
    while ((dest.scrollHeight > dest.clientHeight + 1 || dest.scrollWidth > dest.clientWidth + 1) && s > SCALE_MIN) {
      s -= 0.02;
      setScale(name, sub, s);
    }
  }
  function fitAll() {
    document.querySelectorAll("#board .dest").forEach(fitRow);
  }
  // Layout. Seven rows at the normal one-line status set the row height, and no row grows past it.
  // Alerts come first: the status box takes the height its alerts need, and rows give up space to
  // it, down to MIN_ROWS rows. Only when no alerts need the room do rows shrink to show a larger count.
  const REF_ROWS = 7, MIN_ROWS = 2, GAP_RATIO = 0.1;
  let trainList = null;      // null until the first train refresh; "error", or an array of trains
  let alertList = null;      // null until the first alert refresh; an array of alerts
  let alertFailed = [];      // lines whose status could not be fetched

  function showBoardMessage(text) {
    const board = document.getElementById("board");
    board.textContent = "";
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = text;
    board.appendChild(e);
  }

  function trainRow(t, height, gap) {
    const row = document.createElement("div");
    row.className = "train";
    row.style.height = height + "px";
    row.style.marginTop = gap + "px";
    const minsHtml = t.mins < 1
      ? '<div class="mins">Now</div>'
      : '<div class="mins">' + t.mins + '</div><div class="unit">MIN</div>';
    row.innerHTML =
      '<div class="card">' +
        '<span class="bullet" style="background:' + lineColor(t.route) + '">' + escapeText(t.route) + '</span>' +
        '<div class="dest"><div class="name">' + escapeText(t.direction) + '</div>' +
        '<div class="sub">' + escapeText(t.destination) + '</div></div>' +
        '<div class="eta">' + minsHtml + '</div>' +
      '</div>';
    return row;
  }

  function layout() {
    const board = document.getElementById("board");
    // Seven rows fill the board when the status is one line, so measure it that way.
    renderAlerts([], []);
    const slot = board.clientHeight / (REF_ROWS + (REF_ROWS - 1) * GAP_RATIO);
    renderAlerts(alertList, alertFailed);
    fitAlerts(alertBudget(slot));

    if (trainList === null) return;
    if (trainList === "error") return showBoardMessage("Train times unavailable right now.");
    if (trainList.length === 0) return showBoardMessage("No trains scheduled right now.");

    const gap = slot * GAP_RATIO;
    const avail = board.clientHeight;
    const expanded = alertList !== null && (alertList.length > 0 || alertFailed.length > 0);
    let n = trainList.length;
    if (expanded) {
      const fit = Math.floor((avail + gap) / (slot + gap));
      n = Math.min(trainList.length, Math.max(fit, Math.min(MIN_ROWS, trainList.length)));
    }
    const rowH = Math.max(0, n * slot + (n - 1) * gap <= avail ? slot : (avail - (n - 1) * gap) / n);
    document.documentElement.style.setProperty("--u", rowH + "px");
    board.textContent = "";
    trainList.slice(0, n).forEach((t, i) => board.appendChild(trainRow(t, rowH, i > 0 ? gap : 0)));
    fitAll();
  }
  window.addEventListener("resize", layout);

  // failed lists the lines whose status could not be fetched; those are never reported as normal.
  function renderAlerts(alerts, failed) {
    const box = document.getElementById("alerts");
    box.textContent = "";
    box.style.removeProperty("--desc-scale");
    box.style.removeProperty("--title-scale");
    if (alerts === null) {
      const checking = document.createElement("div");
      checking.className = "ok";
      checking.textContent = "Checking line status…";
      box.appendChild(checking);
      return;
    }
    if (alerts.length === 0 && failed.length === 0) {
      const ok = document.createElement("div");
      ok.className = "ok";
      ok.textContent = ROUTES.join(", ") + (ROUTES.length > 1 ? " lines: service running normally." : " line: service running normally.");
      box.appendChild(ok);
      return;
    }
    for (const a of alerts) {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML =
        '<span class="bullet" style="background:' + lineColor(a.route) + '">' + escapeText(a.route) + '</span>' +
        '<div class="text"><b>' + escapeText(a.header) + '</b><span class="d">' + escapeText(a.description) + '</span>' +
        (a.lines && a.lines.length > 1 ? '<div class="lines">Lines: ' + escapeText(a.lines.join(", ")) + '</div>' : '') + '</div>';
      box.appendChild(item);
    }
    if (failed.length > 0) {
      const bad = document.createElement("div");
      bad.className = "ok";
      bad.textContent = "Line status unavailable: " + failed.join(", ") + ".";
      box.appendChild(bad);
    }
  }

  // Alerts must fit above the rows, with at least MIN_ROWS rows left. Each step runs only if the
  // one before was not enough: 1) descriptions to half size; 2) titles to half size; 3) descriptions
  // hidden except the first alert's; 4) the first description hidden; 5) the last alerts hidden,
  // with a note saying how many are not shown.
  const MIN_SCALE_STEPS = 10;   // 1.0 down to 0.5 in steps of 0.05
  function outerHeight(el) {
    const cs = getComputedStyle(el);
    return el.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
  }
  // Room the status box may take: the screen less the header, footer and the minimum rows.
  function alertBudget(slot) {
    const screen = document.querySelector(".screen");
    const cs = getComputedStyle(screen);
    const content = screen.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const minBoard = MIN_ROWS * slot + (MIN_ROWS - 1) * slot * GAP_RATIO;
    return content - outerHeight(document.querySelector("header")) - outerHeight(document.querySelector(".footer")) - minBoard;
  }
  function fitAlerts(budget) {
    const box = document.getElementById("alerts");
    const status = document.querySelector(".status");
    const fits = () => outerHeight(status) <= budget;
    if (fits()) return;
    const scales = [];
    for (let i = 1; i <= MIN_SCALE_STEPS; i++) scales.push(Math.round((1 - i * 0.05) * 100) / 100);

    for (const s of scales) {                       // 1
      box.style.setProperty("--desc-scale", s);
      if (fits()) return;
    }
    for (const s of scales) {                       // 2
      box.style.setProperty("--title-scale", s);
      if (fits()) return;
    }
    const items = [...box.querySelectorAll(".item")];
    items.slice(1).forEach(i => i.querySelector(".d").classList.add("off"));   // 3
    if (fits()) return;
    if (items.length) items[0].querySelector(".d").classList.add("off");       // 4
    if (fits()) return;

    const more = document.createElement("div");     // 5
    more.className = "more";
    more.textContent = "Additional alerts not displayed…";
    more.hidden = true;
    box.appendChild(more);
    let shown = items.length;
    while (!fits() && shown > 0) {
      shown--;
      items[shown].hidden = true;
      more.hidden = false;
    }
  }

  // Cut at the last whole word before max characters, and mark the cut with an ellipsis.
  function cutText(s, max) {
    if (s.length <= max) return s;
    const cut = s.slice(0, max);
    const at = cut.lastIndexOf(" ");
    return (at > max * 0.5 ? cut.slice(0, at) : cut) + "…";
  }

  async function getJson(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function refreshTrains() {
    try {
      const data = await getJson(STOP_URL);
      document.getElementById("station").textContent = data.name || STOP_ID;
      document.getElementById("subtitle").textContent = LABEL;
      const now = Date.now() / 1000;
      const trains = (data.stopTimes || [])
        .map(s => ({
          epoch: Number((s.arrival && s.arrival.time) || (s.departure && s.departure.time)),
          route: s.trip.route.id,
          direction: s.headsign || LABEL,
          destination: (s.destination && s.destination.name) || ""
        }))
        .filter(t => t.epoch && t.epoch >= now - 30)
        .filter(t => ROUTES.includes(t.route.toUpperCase()))
        .sort((a, b) => a.epoch - b.epoch)
        .slice(0, COUNT)
        .map(t => ({ ...t, mins: minutesUntil(t.epoch) }));
      trainList = trains;
      layout();
      document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (err) {
      // Clear the rows: a stale countdown would show minutes that are no longer true.
      console.error(err);
      if (document.getElementById("station").textContent === "Loading…") {
        document.getElementById("station").textContent = STOP_ID;
      }
      trainList = "error";
      layout();
      document.getElementById("updated").textContent = "Train data unavailable";
    }
  }

  async function refreshAlerts() {
    try {
      // Fetch alerts for every line; a failed line is reported as unavailable, not as normal,
      // and does not hide the other lines. The route lists only alert IDs; the header and
      // description come from each alert.
      const englishText = arr => ((arr || []).find(x => x.language === "en") || (arr || [])[0] || {}).text || "";
      const plainText = s => String(s).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      const results = await Promise.all(ROUTES.map(r =>
        getJson(BASE + "/routes/" + encodeURIComponent(r))
          .then(route => Promise.all((route.alerts || []).slice(0, 3).map(a =>
            getJson(BASE + "/alerts/" + encodeURIComponent(a.id))
              .then(d => ({ route: r, header: plainText(englishText(d.header)), description: cutText(plainText(englishText(d.description)), 200) }))
          )))
          .then(list => ({ route: r, alerts: list }))
          .catch(() => ({ route: r, failed: true }))
      ));
      // One alert can apply to several lines; show it once and list its lines.
      const merged = new Map();
      for (const a of [].concat(...results.filter(x => !x.failed).map(x => x.alerts))) {
        const key = a.header + "|" + a.description;
        if (merged.has(key)) {
          const m = merged.get(key);
          if (!m.lines.includes(a.route)) m.lines.push(a.route);
        } else {
          merged.set(key, { route: a.route, lines: [a.route], header: a.header, description: a.description });
        }
      }
      alertList = [...merged.values()];
      alertFailed = results.filter(x => x.failed).map(x => x.route);
      layout();
    } catch (err) {
      console.error(err);
      alertList = [];
      alertFailed = ROUTES.slice();
      layout();
    }
  }

  function refreshAll() {
    refreshTrains();
    refreshAlerts();
  }

  tickClock();
  setInterval(tickClock, 1000);
  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
